[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.magnafic.com/*"
  to = "https://magnafic.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/ads/business-growth-masterclass"
  to = "/magna-business-masterclass"
  status = 301
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "cross-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
